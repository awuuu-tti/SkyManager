{% extends 'base.html' %}
{% block content %}
<div class="card p-4 form-box">
  <h1 class="h4">Регистрация клиента</h1>
  <form method="post">
    <label class="form-label">ФИО</label><input class="form-control mb-2" name="full_name">
    <label class="form-label">Email</label><input class="form-control mb-2" name="email">
    <label class="form-label">Телефон</label><input class="form-control mb-2" name="phone">
    <label class="form-label">Дата рождения</label><input class="form-control mb-2" type="date" name="birth_date">
    <label class="form-label">Пароль</label><input class="form-control mb-2" type="password" name="password">
    <label class="form-label">Повтор пароля</label><input class="form-control mb-2" type="password" name="confirm_password">
    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="loyalty_member" id="l1"><label class="form-check-label" for="l1">Постоянный клиент</label></div>
    <button class="btn btn-primary">Зарегистрироваться</button>
  </form>
</div>
{% endblock %}
